server:
  port: ${PORT:5000}

spring:
  datasource:
    # Secrets come from environment variables. Nothing sensitive lives in this file.
    url: jdbc:mysql://localhost:3306/ecommerce
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Base64 string of at least 32 random bytes. Generate one with:  openssl rand -base64 32
  secret: YourSuperSecretKeyThatIsAtLeast32BytesLong123!

app:
  cors:
    # Comma-separated frontend origins allowed to call the API from a browser.
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        # Only health and info. Endpoints like env and heapdump expose secrets.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: Ecommerce-App
    description: Ecommerce Backend Application
    version: 1.0.0
