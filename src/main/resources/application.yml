server:
  port: ${PORT:5000}
  compression:
    enabled: true            # gzip JSON responses (product lists shrink a lot)
    mime-types: application/json,text/plain
    min-response-size: 1KB
  shutdown: graceful         # finish in-flight requests before stopping
  tomcat:
    # Lets Tomcat read past an oversized upload so the client gets a 413 JSON error
    # instead of a dropped connection.
    max-swallow-size: 10MB

spring:
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads: waiting on DB/ImageKit no longer ties up OS threads
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    # Secrets come from environment variables. Nothing sensitive lives in this file.
    url: 
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Database connections the app may hold. Keep (this x number of app instances)
      # below your RDS max_connections.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000   # wait at most 5 s for a free connection, then answer 503
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false        # release the DB connection as soon as the service method ends
    hibernate:
      ddl-auto: none           # Flyway owns the schema now (src/main/resources/db/migration)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32   # load lazy relations in batches instead of one query each
  flyway:
    enabled: true
    baseline-on-migrate: true  # existing database: mark V1 as done, then run V2+
    baseline-version: 1
  cache:
    type: caffeine
    cache-names: catalog,categories,product,activeProducts
    caffeine:
      # Catalog reads are served from memory for up to 30 s; product edits clear it at once.
      spec: maximumSize=2000,expireAfterWrite=30s

jwt:
  # Base64 string of at least 32 random bytes. Generate one with:  openssl rand -base64 32
  secret: !

imagekit:
  # From the ImageKit dashboard: Developer options > API keys. Keep it secret.
  private-key: 
  folder: 
  max-file-size-bytes: 5242880

app:
  cors:
    # Comma-separated frontend origins allowed to call the API from a browser.
    # Override with the CORS_ALLOWED_ORIGINS environment variable; no rebuild needed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://voltex-frontend-virid.vercel.app,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        # Only health and info. Endpoints like env and heapdump expose secrets.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: Ecommerce-App
    description: Ecommerce Backend Application
    version: 1.0.0